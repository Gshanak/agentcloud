# Memory-sized override for the AutoGPT Platform on a 12 GB free-tier VM.
#
# Usage (from inside the AutoGPT checkout, after deploy/customize.py):
#   docker compose \
#     -f autogpt_platform/docker-compose.platform.yml \
#     -f /path/to/android-ai-agents/deploy/docker-compose.vm.yml \
#     --env-file autogpt_platform/.env \
#     up -d --build
#
# Budget (~9.3 GB of 12 GB, leaving headroom for the OS and Docker daemon).

services:
  frontend:
    mem_limit: 1g
  rest_server:
    mem_limit: 1500m
  websocket_server:
    mem_limit: 750m
  executor:
    mem_limit: 1500m
  copilot_executor:
    mem_limit: 750m
  scheduler_server:
    mem_limit: 512m
  notification_server:
    mem_limit: 512m
  database_manager:
    mem_limit: 1g
  migrate:
    mem_limit: 512m
  platform_linking_manager:
    mem_limit: 512m
  rabbitmq:
    mem_limit: 512m
  falkordb:
    mem_limit: 512m
  redis-0:
    mem_limit: 256m
  redis-1:
    mem_limit: 256m
  redis-2:
    mem_limit: 256m

  # News Curator PWA static server (http://<vm-ip>:8080).
  # Build context: apps/news-curator-pwa (the Dockerfile copies the app + nginx.conf).
  news-pwa:
    image: nginx:alpine
    mem_limit: 64m
    ports:
      - "8080:80"
    volumes:
      - ../apps/news-curator-pwa:/usr/share/nginx/html:ro
      - ../apps/news-curator-pwa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on: []
