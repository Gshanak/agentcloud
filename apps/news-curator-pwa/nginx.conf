server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the app shell (service worker updates need fresh HTML)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Never cache the service worker
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Cache static assets (CSS, JS, icons) for a day
    location ~* \.(css|js|png|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Everything else -> index.html (SPA-style, though this app is single-page already)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
